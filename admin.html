<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin - TirraCred</title>
  <link rel="icon" type="image/png" href="public/favincon.png"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body{font-family:Inter,sans-serif;background:#f0fdf4}
    .sortable-ghost{opacity:.5;background:#e0f2fe}
  </style>
</head>
<body class="text-gray-800">
  <!-- Header igual ao site -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="/" class="flex items-center">
          <img src="public/logo.png" class="h-8 w-auto" alt="TirraCred">
        </a>
        <div class="flex items-center gap-3">
          <span id="admin-email" class="text-sm text-gray-500 hidden"></span>
          <button id="logout" class="px-3 py-2 rounded-lg bg-red-600 text-white text-sm hidden">Sair</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Login -->
  <section id="login" class="min-h-[70vh] flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-white shadow-xl rounded-2xl p-6">
      <h2 class="text-2xl font-bold text-center mb-6">Acesso do Administrador</h2>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="text-sm font-medium">E-mail</label>
          <input id="email" type="email" required class="mt-1 w-full border rounded-lg p-3 bg-gray-50">
        </div>
        <div>
          <label class="text-sm font-medium">Senha</label>
          <input id="password" type="password" required class="mt-1 w-full border rounded-lg p-3 bg-gray-50">
        </div>
        <button class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg">Entrar</button>
        <p id="login-err" class="text-center text-red-600 text-sm mt-2"></p>
      </form>
    </div>
  </section>

  <!-- Painel -->
  <main id="panel" class="hidden container mx-auto p-4 sm:p-8">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-3xl font-extrabold">Gerenciar Produtos</h1>
      <div class="flex gap-2">
        <button id="new-product" class="px-4 py-2 rounded-lg border">Novo</button>
        <button id="save-order" class="px-4 py-2 rounded-lg bg-green-600 text-white">Salvar ordem</button>
      </div>
    </div>

    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white rounded-xl border shadow-sm">
        <div class="p-4 border-b font-semibold">Ordem (arraste para reordenar)</div>
        <ul id="list" class="p-4 space-y-3"></ul>
      </div>
      <div class="bg-white rounded-xl border shadow-sm">
        <div class="p-4 border-b font-semibold">Detalhes</div>
        <form id="edit-form" class="p-4 space-y-3">
          <input type="hidden" id="id">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-sm">Título</label>
              <input id="titulo" class="w-full border rounded-lg p-2 bg-gray-50">
            </div>
            <div>
              <label class="text-sm">Tag</label>
              <input id="tag" class="w-full border rounded-lg p-2 bg-gray-50">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-sm">Tag Class (red|blue|yellow|purple)</label>
              <input id="tagClass" class="w-full border rounded-lg p-2 bg-gray-50">
            </div>
            <div>
              <label class="text-sm">Logo (URL ou /public/...)</label>
              <input id="logo" class="w-full border rounded-lg p-2 bg-gray-50">
            </div>
          </div>
          <div>
            <label class="text-sm">Link</label>
            <input id="link" class="w-full border rounded-lg p-2 bg-gray-50">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-sm">Botão Primário</label>
              <input id="btnPrimario" class="w-full border rounded-lg p-2 bg-gray-50">
            </div>
            <div>
              <label class="text-sm">Botão Secundário</label>
              <input id="btnSecundario" class="w-full border rounded-lg p-2 bg-gray-50">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-sm">Tipos (vírgula: emprestimo,fgts,cartao,...)</label>
              <input id="tipo" class="w-full border rounded-lg p-2 bg-gray-50">
            </div>
            <div>
              <label class="text-sm">Perfis (vírgula: negativado,score-baixo,...)</label>
              <input id="perfis" class="w-full border rounded-lg p-2 bg-gray-50">
            </div>
          </div>
          <div>
            <label class="text-sm">Vantagens (uma por linha)</label>
            <textarea id="vantagens" rows="5" class="w-full border rounded-lg p-2 bg-gray-50"></textarea>
          </div>
          <div class="flex items-center gap-3">
            <label class="text-sm">Ativo</label>
            <input id="active" type="checkbox" class="h-5 w-5">
          </div>
          <div class="flex gap-2">
            <button class="px-4 py-2 rounded-lg bg-green-600 text-white">Salvar</button>
            <button id="delete" type="button" class="px-4 py-2 rounded-lg bg-red-600 text-white">Excluir</button>
          </div>
          <p id="edit-msg" class="text-sm mt-1"></p>
        </form>
      </div>
    </div>
  </main>

<script>
/** Supabase client **/
const SUPABASE_URL = 'https://hgravyvorwbccyufgksn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhncmF2eXZvcndiY2N5dWZna3NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NzUzMTksImV4cCI6MjA2NzA1MTMxOX0.7s_nF8aRgq6gauYhIEHBrqpvO5QzNtgrZHbBaukM0LI'; // use o anon; service role NUNCA no front
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/** UI refs **/
const $ = (s) => document.querySelector(s);
const loginSec = $('#login');
const panel = $('#panel');
const emailEl = $('#email');
const passEl = $('#password');
const loginErr = $('#login-err');
const logoutBtn = $('#logout');
const adminEmail = $('#admin-email');
const listEl = $('#list');

const form = $('#edit-form');
const fields = {
  id: $('#id'), titulo: $('#titulo'), tag: $('#tag'), tagClass: $('#tagClass'),
  logo: $('#logo'), link: $('#link'), btnPrimario: $('#btnPrimario'), btnSecundario: $('#btnSecundario'),
  tipo: $('#tipo'), perfis: $('#perfis'), vantagens: $('#vantagens'), active: $('#active')
};
const editMsg = $('#edit-msg');

/** Auth gate **/
async function refreshSession() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session?.user) {
    adminEmail.textContent = session.user.email;
    adminEmail.classList.remove('hidden');
    logoutBtn.classList.remove('hidden');
    loginSec.classList.add('hidden');
    panel.classList.remove('hidden');
    await loadProducts();
  } else {
    adminEmail.classList.add('hidden');
    logoutBtn.classList.add('hidden');
    panel.classList.add('hidden');
    loginSec.classList.remove('hidden');
  }
}
refreshSession();

supabase.auth.onAuthStateChange(refreshSession);

$('#login-form')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  loginErr.textContent = '';
  const { error } = await supabase.auth.signInWithPassword({ email: emailEl.value, password: passEl.value });
  if (error) loginErr.textContent = error.message;
});

logoutBtn?.addEventListener('click', async ()=> { await supabase.auth.signOut(); });

/** Data **/
let current = [];       // produtos carregados
let selected = null;    // produto selecionado para editar

async function loadProducts() {
  listEl.innerHTML = '<div class="p-6 text-center text-gray-500">Carregando...</div>';
  const { data, error } = await supabase.from('products').select('*').order('priority_order', { ascending: true });
  if (error) { listEl.innerHTML = `<div class="p-6 text-center text-red-600">${error.message}</div>`; return; }
  current = data || [];
  renderList();
}

function renderList() {
  listEl.innerHTML = '';
  current.forEach(p => {
    const li = document.createElement('li');
    li.className = 'bg-white border rounded-lg p-3 flex items-center gap-3';
    li.dataset.id = p.id;
    li.innerHTML = `
      <span class="cursor-move text-gray-400">≡</span>
      <img src="${p.logo}" class="h-8 w-8 object-contain" onerror="this.src='https://placehold.co/32x32';"/>
      <div class="flex-1">
        <div class="font-semibold">${p.titulo}</div>
        <div class="text-xs text-gray-500">#${p.id} · prioridade ${p.priority_order ?? '-'}</div>
      </div>
      <button class="px-3 py-1 rounded border text-sm">Editar</button>
    `;
    li.querySelector('button').addEventListener('click', () => selectForEdit(p.id));
    listEl.appendChild(li);
  });

  new Sortable(listEl, { animation: 150, ghostClass: 'sortable-ghost' });
}

function getDomOrderIds() {
  return Array.from(listEl.children).map(li => Number(li.dataset.id));
}

$('#save-order')?.addEventListener('click', async () => {
  const ids = getDomOrderIds();
  const rows = ids.map((id, i) => ({ id, priority_order: i + 1 }));
  const { error } = await supabase.from('products').upsert(rows, { onConflict: 'id' });
  editMsg.textContent = error ? `Erro: ${error.message}` : 'Ordem salva!';
  editMsg.className = error ? 'text-red-600' : 'text-green-700';
  if (!error) await loadProducts();
});

$('#new-product')?.addEventListener('click', () => {
  selected = null;
  form.reset();
  fields.id.value = '';
  editMsg.textContent = '';
});

async function selectForEdit(id) {
  selected = current.find(p => p.id === id);
  if (!selected) return;
  fields.id.value = selected.id;
  fields.titulo.value = selected.titulo || '';
  fields.tag.value = selected.tag || '';
  fields.tagClass.value = selected.tagClass || '';
  fields.logo.value = selected.logo || '';
  fields.link.value = selected.link || '';
  fields.btnPrimario.value = selected.btnPrimario || '';
  fields.btnSecundario.value = selected.btnSecundario || '';
  fields.tipo.value = Array.isArray(selected.tipo) ? selected.tipo.join(',') : (selected.tipo || '');
  fields.perfis.value = Array.isArray(selected.perfis) ? selected.perfis.join(',') : (selected.perfis || '');
  fields.vantagens.value = Array.isArray(selected.vantagens) ? selected.vantagens.join('\n') : (selected.vantagens || '');
  fields.active.checked = !!selected.active;
  editMsg.textContent = '';
}

form?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    titulo: fields.titulo.value.trim(),
    tag: fields.tag.value.trim(),
    tagClass: fields.tagClass.value.trim(),
    logo: fields.logo.value.trim(),
    link: fields.link.value.trim(),
    btnPrimario: fields.btnPrimario.value.trim(),
    btnSecundario: fields.btnSecundario.value.trim(),
    tipo: fields.tipo.value.split(',').map(s => s.trim()).filter(Boolean),
    perfis: fields.perfis.value.split(',').map(s => s.trim()).filter(Boolean),
    vantagens: fields.vantagens.value.split('\n').map(s => s.trim()).filter(Boolean),
    active: fields.active.checked
  };

  let error;
  if (fields.id.value) {
    ({ error } = await supabase.from('products').update(payload).eq('id', Number(fields.id.value)));
  } else {
    // novo: joga para o fim da fila
    const priority = (current[current.length-1]?.priority_order || 0) + 1;
    ({ error } = await supabase.from('products').insert([{ ...payload, priority_order: priority }]));
  }

  editMsg.textContent = error ? `Erro: ${error.message}` : 'Salvo com sucesso!';
  editMsg.className = error ? 'text-red-600' : 'text-green-700';
  if (!error) await loadProducts();
});

$('#delete')?.addEventListener('click', async () => {
  if (!fields.id.value) return;
  if (!confirm('Tem certeza que deseja excluir este produto?')) return;
  const { error } = await supabase.from('products').delete().eq('id', Number(fields.id.value));
  editMsg.textContent = error ? `Erro: ${error.message}` : 'Excluído!';
  editMsg.className = error ? 'text-red-600' : 'text-green-700';
  if (!error) { form.reset(); await loadProducts(); }
});
</script>
</body>
</html>
