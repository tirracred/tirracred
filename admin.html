<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Admin – Ofertas</title>
<link rel="icon" type="image/png" href="public/favincon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:Inter,sans-serif;background:#f0fdf4}</style>
</head>
<body class="text-gray-800">
  <!-- Header -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="index.html" class="flex items-center">
          <img src="public/logo.png" alt="TirraCred" class="h-8 w-auto">
        </a>
        <div class="flex items-center gap-3">
          <span id="who" class="text-sm text-gray-600"></span>
          <button id="btnPublish" class="hidden sm:inline-flex bg-green-600 hover:bg-green-700 text-white font-semibold rounded-lg px-4 py-2">Publicar</button>
          <button id="btnLogout" class="border border-gray-300 hover:bg-gray-50 rounded-lg px-3 py-2">Sair</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-8">

    <!-- Produtos -->
    <section class="bg-white rounded-2xl shadow p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold">Produtos</h2>
        <button id="btnNewP" class="border border-gray-300 hover:bg-gray-50 rounded-lg px-3 py-2">Novo</button>
      </div>

      <!-- Form produto -->
      <form id="formP" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="hidden" name="id">

        <div>
          <label class="block text-sm font-medium mb-1">Título</label>
          <input name="titulo" required class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Logo (URL)</label>
          <input name="logo" placeholder="https://..." class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white" oninput="previewLogo(this.value)">
        </div>

        <div class="md:col-span-2">
          <div class="flex items-center gap-3">
            <img id="logoPreview" alt="Prévia do logo" class="h-10 w-auto hidden">
            <span class="text-xs text-gray-500">Pré-visualização</span>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Tag</label>
          <input name="tag" class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Classe da Tag (opcional)</label>
          <input name="tagClass" placeholder="red, blue, yellow..." class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Tipos</label>
          <select id="tipoSel" multiple size="7" class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
            <option value="emprestimo">Empréstimo</option>
            <option value="emprestimocomgarantia">Empréstimo com Garantia</option>
            <option value="cartao">Cartão</option>
            <option value="contas">Conta</option>
            <option value="fgts">FGTS</option>
            <option value="bolsafamilia">Bolsa Família</option>
            <option value="seguro">Seguro</option>
            <option value="renegociar">Renegociar</option>
          </select>
          <small class="text-xs text-gray-500">Segure CTRL/⌘ para selecionar várias.</small>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Perfis</label>
          <select id="perfisSel" multiple size="6" class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
            <option value="negativado">Negativado</option>
            <option value="score-baixo">Score Baixo</option>
            <option value="score-regular">Score Regular</option>
            <option value="autonomo">Autônomo</option>
            <option value="aposentado">Aposentado</option>
          </select>
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm font-medium mb-1">Vantagens (uma por linha)</label>
          <textarea name="vantagens" rows="4" class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white"></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Link</label>
          <input name="link" required class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Botão Primário</label>
          <input name="btnPrimario" value="Acessar" class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Botão Secundário</label>
          <input name="btnSecundario" value="Detalhes" class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Ordem</label>
          <input name="ordem" type="number" min="0" class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Ativo</label>
          <select name="ativo" class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
            <option value="true">true</option>
            <option value="false">false</option>
          </select>
        </div>

        <!-- Onde aparece -->
        <div class="md:col-span-2 flex items-center gap-6 mt-2">
          <label class="inline-flex items-center gap-2">
            <input type="checkbox" id="show_index" checked class="rounded border-gray-300">
            <span>Mostrar no <strong>Index</strong></span>
          </label>
          <label class="inline-flex items-center gap-2">
            <input type="checkbox" id="show_resultados" checked class="rounded border-gray-300">
            <span>Mostrar em <strong>Resultados</strong></span>
          </label>
        </div>

        <div class="md:col-span-2 flex justify-end gap-2">
          <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-semibold rounded-lg px-4 py-2">Salvar</button>
          <button type="button" id="btnClearP" class="border border-gray-300 hover:bg-gray-50 rounded-lg px-3 py-2">Limpar</button>
        </div>
      </form>

      <!-- Tabela -->
      <div class="mt-6 overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead><tr class="text-left text-gray-600">
            <th class="py-2 pr-4">ID</th><th class="py-2 pr-4">Título</th><th class="py-2 pr-4">Tipos</th><th class="py-2 pr-4">Perfis</th><th class="py-2 pr-4">Index/Res</th><th class="py-2 pr-4">Ordem</th><th class="py-2 pr-4">Ações</th>
          </tr></thead>
          <tbody id="tblP" class="align-top"></tbody>
        </table>
      </div>
    </section>

    <!-- Regras -->
    <section class="bg-white rounded-2xl shadow p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold">Regras (prioridade/chance/A-B)</h2>
      </div>

      <form id="formR" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">Perfil (nome)</label>
          <input name="nome" placeholder="default, negativado..." required class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">ab_split (0–1)</label>
          <input name="ab_split" type="number" step="0.01" min="0" max="1" class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">priority_ids (CSV)</label>
          <input name="priority_ids" placeholder="1,2,3" class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">ab_a_ids (CSV)</label>
          <input name="ab_a_ids" placeholder="1,2,3" class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">ab_b_ids (CSV)</label>
          <input name="ab_b_ids" placeholder="4,5,6" class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">chance_min</label>
          <input name="chance_min" type="number" min="0" max="100" value="75" class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">chance_max</label>
          <input name="chance_max" type="number" min="0" max="100" value="98" class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">tipo_chance_override</label>
          <input name="tipo_chance_override" placeholder="fgts" class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">tipo_chance_value</label>
          <input name="tipo_chance_value" type="number" min="0" max="100" value="99" class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
        </div>
        <div class="md:col-span-2 flex justify-end gap-2">
          <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-semibold rounded-lg px-4 py-2">Salvar</button>
          <button type="button" id="reloadR" class="border border-gray-300 hover:bg-gray-50 rounded-lg px-3 py-2">Recarregar</button>
        </div>
      </form>

      <div class="mt-6 overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead><tr class="text-left text-gray-600">
            <th class="py-2 pr-4">Perfil</th><th class="py-2 pr-4">priority_ids</th><th class="py-2 pr-4">A/B</th><th class="py-2 pr-4">Chance</th><th class="py-2 pr-4">Override</th><th class="py-2 pr-4">Ações</th>
          </tr></thead>
          <tbody id="tblR" class="align-top"></tbody>
        </table>
      </div>
    </section>
  </main>

<script>
let sb, user;

const toArr = (s)=> s.split(',').map(x=>x.trim()).filter(Boolean);
const toNumArr = (s)=> toArr(s).map(Number).filter(n=>!isNaN(n));

function previewLogo(url){
  const img = document.getElementById('logoPreview');
  if (!url) { img.classList.add('hidden'); return; }
  img.src = url; img.classList.remove('hidden');
}

/* ===== boot + guard ===== */
async function boot(){
  const r = await fetch('/.netlify/functions/config',{cache:'no-store'});
  if(!r.ok){ alert('Config indisponível'); return; }
  const { supabaseUrl, supabaseAnonKey } = await r.json();
  sb = supabase.createClient(supabaseUrl, supabaseAnonKey);

  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ location.href='login.html'; return; }
  user = session.user;
  document.getElementById('who').textContent = user.email || '';

  await loadProducts();
  await loadRules();
}
boot();

/* ===== logout ===== */
document.getElementById('btnLogout').onclick = async ()=>{
  await sb.auth.signOut();
  location.href='login.html';
};

/* ===== Products ===== */
function setMulti(id, values){
  const sel = document.getElementById(id);
  const set = new Set(values);
  Array.from(sel.options).forEach(o=> o.selected = set.has(o.value));
}
function getMulti(id){
  return Array.from(document.getElementById(id).selectedOptions).map(o=>o.value);
}

async function loadProducts(){
  const { data, error } = await sb.from('products').select('*').order('ordem',{ascending:true,nullsFirst:true}).order('id',{ascending:true});
  if(error) return alert(error.message);
  const tb = document.getElementById('tblP'); tb.innerHTML='';
  (data||[]).forEach(p=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="py-2 pr-4">${p.id}</td>
      <td class="py-2 pr-4">${p.titulo||''}</td>
      <td class="py-2 pr-4">${(p.tipo||[]).join(', ')}</td>
      <td class="py-2 pr-4">${(p.perfis||[]).join(', ')}</td>
      <td class="py-2 pr-4">${p.show_in_index!==false?'✓':'×'} / ${p.show_in_resultados!==false?'✓':'×'}</td>
      <td class="py-2 pr-4">${p.ordem ?? ''}</td>
      <td class="py-2 pr-4">
        <button class="underline text-green-700" onclick="editP(${p.id})">Editar</button>
        <span class="mx-1">·</span>
        <button class="underline text-red-600" onclick="delP(${p.id})">Excluir</button>
      </td>`;
    tb.appendChild(tr);
  });
}

async function editP(id){
  const { data, error } = await sb.from('products').select('*').eq('id',id).single();
  if(error) return alert(error.message);
  const f = document.getElementById('formP'); const p = data;
  f.id.value = p.id || '';
  f.titulo.value = p.titulo || '';
  f.logo.value = p.logo || '';
  previewLogo(p.logo || '');
  f.tag.value = p.tag || '';
  f.tagClass.value = p.tagClass || '';
  setMulti('tipoSel', p.tipo || []);
  setMulti('perfisSel', p.perfis || []);
  f.vantagens.value = (p.vantagens||[]).join('\n');
  f.link.value = p.link || '';
  f.btnPrimario.value = p.btnPrimario || 'Acessar';
  f.btnSecundario.value = p.btnSecundario || 'Detalhes';
  f.ordem.value = p.ordem ?? '';
  f.ativo.value = (p.ativo ?? true) ? 'true' : 'false';
  document.getElementById('show_index').checked = p.show_in_index !== false;
  document.getElementById('show_resultados').checked = p.show_in_resultados !== false;
}

async function delP(id){
  if(!confirm('Excluir produto '+id+'?')) return;
  const { error } = await sb.from('products').delete().eq('id', id);
  if(error) alert(error.message); else loadProducts();
}

document.getElementById('formP').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const f = e.target;
  const payload = {
    id: f.id.value ? +f.id.value : undefined,
    titulo: f.titulo.value.trim(),
    logo: f.logo.value.trim(),
    tag: f.tag.value.trim(),
    tagClass: f.tagClass.value.trim() || null,
    tipo: getMulti('tipoSel'),
    perfis: getMulti('perfisSel'),
    vantagens: f.vantagens.value.split('\n').map(s=>s.trim()).filter(Boolean),
    link: f.link.value.trim(),
    btnPrimario: f.btnPrimario.value.trim() || 'Acessar',
    btnSecundario: f.btnSecundario.value.trim() || 'Detalhes',
    ordem: f.ordem.value ? +f.ordem.value : null,
    ativo: f.ativo.value === 'true',
    show_in_index: document.getElementById('show_index').checked,
    show_in_resultados: document.getElementById('show_resultados').checked
  };
  const { error } = await sb.from('products').upsert(payload).select().single();
  if(error) return alert(error.message);
  f.reset(); previewLogo('');
  setMulti('tipoSel', []); setMulti('perfisSel', []);
  document.getElementById('show_index').checked = true;
  document.getElementById('show_resultados').checked = true;
  loadProducts();
});

document.getElementById('btnClearP').onclick = ()=>{
  const f = document.getElementById('formP');
  f.reset(); previewLogo('');
  setMulti('tipoSel', []); setMulti('perfisSel', []);
  document.getElementById('show_index').checked = true;
  document.getElementById('show_resultados').checked = true;
};
document.getElementById('btnNewP').onclick = ()=> document.getElementById('btnClearP').click();

/* ===== Regras ===== */
async function loadRules(){
  const { data, error } = await sb.from('rules').select('*').order('nome');
  if(error) return alert(error.message);
  const tb = document.getElementById('tblR'); tb.innerHTML='';
  (data||[]).forEach(r=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="py-2 pr-4">${r.nome}</td>
      <td class="py-2 pr-4">${(r.priority_ids||[]).join(',')}</td>
      <td class="py-2 pr-4">${r.ab_split ?? ''} (A: ${(r.ab_a_ids||[]).join(',')} / B: ${(r.ab_b_ids||[]).join(',')})</td>
      <td class="py-2 pr-4">${r.chance_min ?? ''}–${r.chance_max ?? ''}</td>
      <td class="py-2 pr-4">${r.tipo_chance_override||''}:${r.tipo_chance_value??''}</td>
      <td class="py-2 pr-4">
        <button class="underline text-green-700" onclick="editR('${r.nome.replace(/'/g,"\\'")}')">Editar</button>
        <span class="mx-1">·</span>
        <button class="underline text-red-600" onclick="delR('${r.nome.replace(/'/g,"\\'")}')">Excluir</button>
      </td>`;
    tb.appendChild(tr);
  });
}

async function editR(nome){
  const { data, error } = await sb.from('rules').select('*').eq('nome', nome).single();
  if(error) return alert(error.message);
  const f = document.getElementById('formR'); const r = data;
  f.nome.value = r.nome;
  f.ab_split.value = r.ab_split ?? '';
  f.priority_ids.value = (r.priority_ids||[]).join(',');
  f.ab_a_ids.value = (r.ab_a_ids||[]).join(',');
  f.ab_b_ids.value = (r.ab_b_ids||[]).join(',');
  f.chance_min.value = r.chance_min ?? '';
  f.chance_max.value = r.chance_max ?? '';
  f.tipo_chance_override.value = r.tipo_chance_override || '';
  f.tipo_chance_value.value = r.tipo_chance_value ?? '';
}

async function delR(nome){
  if(!confirm('Excluir regra '+nome+'?')) return;
  const { error } = await sb.from('rules').delete().eq('nome', nome);
  if(error) alert(error.message); else loadRules();
}

document.getElementById('formR').addEventListener('submit', async (e)=>{
  e.preventDefault(); const f=e.target;
  const payload = {
    nome: f.nome.value.trim(),
    ab_split: f.ab_split.value ? Number(f.ab_split.value) : null,
    priority_ids: toNumArr(f.priority_ids.value),
    ab_a_ids: toNumArr(f.ab_a_ids.value),
    ab_b_ids: toNumArr(f.ab_b_ids.value),
    chance_min: f.chance_min.value ? Number(f.chance_min.value) : null,
    chance_max: f.chance_max.value ? Number(f.chance_max.value) : null,
    tipo_chance_override: f.tipo_chance_override.value.trim() || null,
    tipo_chance_value: f.tipo_chance_value.value ? Number(f.tipo_chance_value.value) : null
  };
  const { error } = await sb.from('rules').upsert(payload).select().single();
  if(error) return alert(error.message);
  f.reset(); loadRules();
});

/* ===== Publish ===== */
document.getElementById('btnPublish').onclick = async ()=>{
  const { data:{ session } } = await sb.auth.getSession();
  if(!session?.access_token) return alert('Faça login novamente.');
  const resp = await fetch('/.netlify/functions/publish', {
    method:'POST', headers:{ 'content-type':'application/json' },
    body: JSON.stringify({ accessToken: session.access_token })
  });
  if(!resp.ok) return alert('Falha na publicação: '+await resp.text());
  alert('Publicado! O Netlify deve iniciar o deploy em instantes.');
};
</script>
</body>
</html>
