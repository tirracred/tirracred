<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Admin – Ofertas (Drag & Drop com Imagens)</title>
<link rel="icon" type="image/png" href="public/favincon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<style>
  :root{--bg:#f0fdf4}
  body{font-family:Inter,sans-serif;background:var(--bg)}
  .card{transition:transform .15s ease, box-shadow .15s ease}
  .card:hover{transform:translateY(-2px);box-shadow:0 18px 30px -15px rgba(0,0,0,.25)}
  .fade-in{animation:fade .22s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .ghost{opacity:.45}
  .dragging{transform:rotate(.6deg) scale(1.02)}
  .dropzone{min-height:200px}
  .pill{border:1px solid #e5e7eb;background:#fff}
</style>
</head>
<body class="text-gray-800">
  <!-- Header -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="/" class="flex items-center gap-2">
          <img src="public/logo.png" alt="TirraCred" class="h-8 w-auto">
          <span class="hidden sm:inline text-sm text-gray-500">Admin de Ofertas</span>
        </a>
        <div class="flex items-center gap-2">
          <span id="who" class="hidden sm:inline text-sm text-gray-600"></span>
          <button id="btnPublish" class="bg-green-600 hover:bg-green-700 text-white font-semibold rounded-lg px-4 py-2">Publicar</button>
          <button id="btnLogout" class="border border-gray-300 hover:bg-gray-50 rounded-lg px-3 py-2">Sair</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-8">

    <!-- Painel visual de arrastar -->
    <section class="bg-white rounded-2xl shadow p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold">Prioridades por página (arraste os cards)</h2>
        <div class="flex gap-2">
          <button id="btnImport" class="pill rounded-lg px-3 py-2" title="Carregar do HTML (index e pages/resultados)">↻ Importar do HTML</button>
          <button id="saveIndex" class="pill rounded-lg px-3 py-2">Salvar ordem Index</button>
          <button id="saveResults" class="pill rounded-lg px-3 py-2">Salvar ordem Resultados</button>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div>
          <div class="flex items-center justify-between mb-2">
            <h3 class="font-semibold">Index</h3>
            <span id="countIndex" class="text-xs text-gray-500">0</span>
          </div>
          <ul id="listIndex" class="dropzone space-y-2 p-2 rounded-lg border border-gray-200 bg-gray-50"></ul>
        </div>
        <div>
          <div class="flex items-center justify-between mb-2">
            <h3 class="font-semibold">Resultados</h3>
            <span id="countResults" class="text-xs text-gray-500">0</span>
          </div>
          <ul id="listResults" class="dropzone space-y-2 p-2 rounded-lg border border-gray-200 bg-gray-50"></ul>
        </div>
        <div>
          <div class="flex items-center justify-between mb-2">
            <h3 class="font-semibold">Lixeira</h3>
            <span id="countTrash" class="text-xs text-gray-500">0</span>
          </div>
          <ul id="listTrash" class="dropzone space-y-2 p-2 rounded-lg border border-gray-200 bg-gray-50"></ul>
        </div>
      </div>

      <p class="text-xs text-gray-500 mt-4">Arraste entre as colunas. ✏️ edita o item; 🗑 inativa. Salve a ordem de cada página para gravar a prioridade visual.</p>
    </section>

    <!-- Form produto (edição rápida) -->
    <section class="bg-white rounded-2xl shadow p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold">Produto</h2>
        <button id="btnNewP" class="pill rounded-lg px-3 py-2">Novo</button>
      </div>
      <form id="formP" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="hidden" name="id">

        
        <div>
          <label class="block text-sm font-medium mb-1">Título</label>
          <input name="titulo" required class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
        </div>


        <div>
          <label class="block text-sm font-medium mb-1">Logo (URL)</label>
          <input name="logo" placeholder="https://..." class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white" oninput="previewLogo(this.value)">
        </div>
        <div class="md:col-span-2 flex items-center gap-3">
          <img id="logoPreview" alt="Prévia do logo" class="h-10 w-auto hidden">
          <span class="text-xs text-gray-500">Pré-visualização</span>
        </div>


        <div>
          <label class="block text-sm font-medium mb-1">Tag</label>
          <input name="tag" class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
        </div>


        <div>
          <label class="block text-sm font-medium mb-1">Classe da Tag (opcional)</label>
          <input name="tagClass" class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white" placeholder="green|yellow|red">
        </div>


        <div>
          <label class="block text-sm font-medium mb-1">Tipos</label>
          <select id="tipoSel" multiple size="7" class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
            <option value="emprestimo">Empréstimo</option>
            <option value="emprestimocomgarantia">Empréstimo com Garantia</option>
            <option value="cartao">Cartão</option>
            <option value="contas">Conta</option>
            <option value="fgts">FGTS</option>
            <option value="bolsafamilia">Bolsa Família</option>
            <option value="seguro">Seguro</option>
            <option value="renegociar">Renegociar</option>
          </select>


        </div>


        <div>
          <label class="block text-sm font-medium mb-1">Perfis</label>
          <select id="perfisSel" multiple size="6" class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
            <option value="negativado">Negativado</option>
            <option value="score-baixo">Score Baixo</option>
            <option value="score-regular">Score Regular</option>
            <option value="autonomo">Autônomo</option>
            <option value="aposentado">Aposentado</option>
          </select>
        </div>


        <div class="md:col-span-2">
          <label class="block text-sm font-medium mb-1">Vantagens (uma por linha)</label>
          <textarea name="vantagens" rows="4" class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white"></textarea>
        </div>


        <div>
          <label class="block text-sm font-medium mb-1">Link</label>
          <input name="link" required class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
        </div>


        <div>
          <label class="block text-sm font-medium mb-1">Botão Primário</label>
          <input name="btnPrimario" value="Acessar" class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Botão Secundário</label>
          <input name="btnSecundario" value="Detalhes" class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
        </div>


        <div class="md:col-span-2 flex items-center gap-6 mt-2">
          <label class="inline-flex items-center gap-2">
            <input type="checkbox" id="show_index" checked class="rounded border-gray-300">
            <span>Mostrar no <strong>Index</strong></span>
          </label>
          <label class="inline-flex items-center gap-2">
            <input type="checkbox" id="show_resultados" checked class="rounded border-gray-300">
            <span>Mostrar em <strong>Resultados</strong></span>
          </label>
        </div>

        <div class="md:col-span-2 flex justify-end gap-2">
          <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-semibold rounded-lg px-4 py-2">Salvar</button>
          <button type="button" id="btnClearP" class="pill rounded-lg px-3 py-2">Limpar</button>
        </div>
      </form>



    </section>



  </main>

<script>
let sb, user; // supabase client + user

function previewLogo(url){
  const img = document.getElementById('logoPreview');
  if (!url) { img.classList.add('hidden'); return; }
  img.src = url; img.classList.remove('hidden');
}

// ===== boot (pega env seguro do Netlify) =====
async function boot(){
  const r = await fetch('/.netlify/functions/config',{cache:'no-store'});
  if(!r.ok){ alert('Config indisponível'); return; }
  const { supabaseUrl, supabaseAnonKey } = await r.json();
  sb = supabase.createClient(supabaseUrl, supabaseAnonKey);

  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ location.href='login.html'; return; }
  user = session.user;
  document.getElementById('who').textContent = user.email || '';

  await hydrateFromHtmlOrDb(); // carrega listas
}
boot();

// ===== Publish via function (usa env server-side) =====
document.getElementById('btnPublish').onclick = async ()=>{
  const { data:{ session } } = await sb.auth.getSession();
  if(!session?.access_token) return alert('Faça login novamente.');
  const resp = await fetch('/.netlify/functions/publish',{
    method:'POST',headers:{'content-type':'application/json'},
    body: JSON.stringify({ accessToken: session.access_token })
  });
  const t = await resp.text();
  try{ const j = JSON.parse(t); if(!resp.ok || j.ok===false) throw new Error(j.error||t); alert('Publicado!'); }
  catch(e){ alert('Falha na publicação: '+ t); }
};

document.getElementById('btnLogout').onclick = async ()=>{ await sb.auth.signOut(); location.href='login.html'; };

// ===== UI helpers =====
function card(p){
  return `
  <li class="card fade-in bg-white border border-gray-200 rounded-xl p-2 flex items-center gap-3" data-id="${p.id}">
    <img src="${p.logo||''}" class="h-10 w-10 object-contain rounded bg-gray-50 p-1" onerror="this.style.display='none'">
    <div class="flex-1 min-w-0">
      <div class="font-semibold truncate">${p.titulo||'(sem título)'} <span class="text-[10px] text-gray-500">#${p.id}</span></div>
      <div class="text-[11px] text-gray-500 truncate">${(p.tipo||[]).join(', ')}</div>
    </div>
    <button class="edit-btn text-xs px-2 py-1 rounded border border-gray-300 hover:bg-gray-50" title="Editar">✏️</button>
    <button class="kill-btn text-xs px-2 py-1 rounded border border-red-300 text-red-600 hover:bg-red-50" title="Inativar">🗑</button>
  </li>`;
}

function wireCardButtons(root){
  root.querySelectorAll('.edit-btn').forEach(btn=>{
    btn.onclick = (e)=>{ const id=Number(e.target.closest('li').dataset.id); editP(id); window.scrollTo({top:0,behavior:'smooth'}); };
  });
  root.querySelectorAll('.kill-btn').forEach(btn=>{
    btn.onclick = async (e)=>{ const id = Number(e.target.closest('li').dataset.id); if(!confirm('Inativar #'+id+'?')) return; await sb.from('products').update({ativo:false}).eq('id',id); await hydrateFromHtmlOrDb(); };
  });
}

function setCount(){
  const c = (sel)=> document.querySelectorAll(sel+'> li').length;
  document.getElementById('countIndex').textContent   = c('#listIndex');
  document.getElementById('countResults').textContent = c('#listResults');
  document.getElementById('countTrash').textContent   = c('#listTrash');
}

// ===== Dados: tenta ler const allProducts dos HTMLs; fallback Supabase =====
async function tryReadAllProductsFrom(path){
  try{
    const r = await fetch(path,{cache:'no-store'});
    if(!r.ok) return null;
    const html = await r.text();
    const m = html.match(/const\s+allProducts\s*=\s*(\[[\s\S]*?\])\s*;/);
    if(!m) return null;
    return JSON.parse(m[1]);
  }catch{ return null }
}

async function hydrateFromHtmlOrDb(){
  let indexArr   = await tryReadAllProductsFrom('/index.html');
  let resultsArr = await tryReadAllProductsFrom('/pages/resultados.html');

  if(!indexArr && !resultsArr){
    const { data, error } = await sb.from('products').select('*');
    if(error){ alert(error.message); return; }
    indexArr   = data.filter(p=>p.ativo!==false && p.show_in_index!==false).sort((a,b)=>(a.ordem_index??9999)-(b.ordem_index??9999)||a.id-b.id);
    resultsArr = data.filter(p=>p.ativo!==false && p.show_in_resultados!==false).sort((a,b) => (a.ordem_resultados??9999)-(b.ordem_resultados??9999)||a.id-b.id);
  }

  renderLists(indexArr||[], resultsArr||[]);
}

function renderLists(indexArr, resultsArr){
  const lIndex  = document.getElementById('listIndex');
  const lRes    = document.getElementById('listResults');
  const lTrash  = document.getElementById('listTrash');

  lIndex.innerHTML = ''; lRes.innerHTML=''; lTrash.innerHTML='';

  indexArr.forEach(p=> lIndex.insertAdjacentHTML('beforeend', card(p)));
  resultsArr.forEach(p=> lRes.insertAdjacentHTML('beforeend', card(p)));

  wireCardButtons(lIndex); wireCardButtons(lRes); wireCardButtons(lTrash);
  initDnD(); setCount();
}

// ===== Drag & Drop =====
let sortIndex, sortResults, sortTrash;
function initDnD(){
  sortIndex && sortIndex.destroy();
  sortResults && sortResults.destroy();
  sortTrash && sortTrash.destroy();

  const common = { animation:180, ghostClass:'ghost', dragClass:'dragging' };

  sortIndex = new Sortable(listIndex,{
    ...common, group:{name:'index', put:['results','trash']},
    onAdd: async (evt)=>{ const id=+evt.item.dataset.id; await sb.from('products').upsert({id,show_in_index:true,ativo:true}); setCount(); },
    onSort: ()=> setCount()
  });

  sortResults = new Sortable(listResults,{
    ...common, group:{name:'results', put:['index','trash']},
    onAdd: async (evt)=>{ const id=+evt.item.dataset.id; await sb.from('products').upsert({id,show_in_resultados:true,ativo:true}); setCount(); },
    onSort: ()=> setCount()
  });

  sortTrash = new Sortable(listTrash,{
    ...common, group:{name:'trash', put:['index','results']},
    onAdd: async (evt)=>{
      const id=+evt.item.dataset.id; const from=evt.from.id;
      if(from==='listIndex') await sb.from('products').upsert({id,show_in_index:false});
      else if(from==='listResults') await sb.from('products').upsert({id,show_in_resultados:false});
      else await sb.from('products').upsert({id,ativo:false});
      setCount();
    }
  });
}

// ===== Salvar ordem =====
async function saveOrder(page){
  const listId = page==='index'?'listIndex':'listResults';
  const ordField = page==='index'?'ordem_index':'ordem_resultados';
  const rows = Array.from(document.querySelectorAll(`#${listId} > li`)).map((li,i)=>({ id:+li.dataset.id, [ordField]: i+1 }));
  if(!rows.length){ alert('Nada para salvar.'); return; }
  const { error } = await sb.from('products').upsert(rows);
  if(error) return alert(error.message);
  alert('Ordem salva!');

}

document.getElementById('saveIndex').onclick   = ()=> saveOrder('index');
document.getElementById('saveResults').onclick = ()=> saveOrder('results');

document.getElementById('btnImport').onclick = hydrateFromHtmlOrDb;

// ===== Form CRUD =====
function setMulti(id, values){ const sel=document.getElementById(id); const set=new Set(values||[]); Array.from(sel.options).forEach(o=>o.selected=set.has(o.value)); }
function getMulti(id){ return Array.from(document.getElementById(id).selectedOptions).map(o=>o.value); }

async function editP(id){
  const { data, error } = await sb.from('products').select('*').eq('id',id).single();
  if(error) return alert(error.message);
  const f = document.getElementById('formP'); const p=data;
  f.id.value=p.id||''; f.titulo.value=p.titulo||''; f.logo.value=p.logo||''; previewLogo(p.logo||'');
  f.tag.value=p.tag||''; f.tagClass.value=p.tagClass||''; setMulti('tipoSel',p.tipo||[]); setMulti('perfisSel',p.perfis||[]);
  f.vantagens.value=(p.vantagens||[]).join('\n'); f.link.value=p.link||''; f.btnPrimario.value=p.btnPrimario||'Acessar'; f.btnSecundario.value=p.btnSecundario||'Detalhes';
  document.getElementById('show_index').checked = p.show_in_index!==false;
  document.getElementById('show_resultados').checked = p.show_in_resultados!==false;
}

async function delP(id){ if(!confirm('Excluir produto '+id+'?')) return; const {error}=await sb.from('products').delete().eq('id',id); if(error) alert(error.message); else hydrateFromHtmlOrDb(); }

document.getElementById('formP').addEventListener('submit', async (e)=>{
  e.preventDefault(); const f=e.target;
  const payload={ id: f.id.value?+f.id.value:undefined, titulo:f.titulo.value.trim(), logo:f.logo.value.trim(), tag:f.tag.value.trim(), tagClass:f.tagClass.value.trim()||null, tipo:getMulti('tipoSel'), perfis:getMulti('perfisSel'), vantagens:f.vantagens.value.split('\n').map(s=>s.trim()).filter(Boolean), link:f.link.value.trim(), btnPrimario:f.btnPrimario.value.trim()||'Acessar', btnSecundario:f.btnSecundario.value.trim()||'Detalhes', show_in_index: document.getElementById('show_index').checked, show_in_resultados: document.getElementById('show_resultados').checked, ativo:true };
  const { error } = await sb.from('products').upsert(payload).select().single();
  if(error) return alert(error.message);
  f.reset(); previewLogo(''); setMulti('tipoSel',[]); setMulti('perfisSel',[]);
  document.getElementById('show_index').checked = true; document.getElementById('show_resultados').checked = true;
  await hydrateFromHtmlOrDb();
});

document.getElementById('btnClearP').onclick = ()=>{ const f=document.getElementById('formP'); f.reset(); previewLogo(''); setMulti('tipoSel',[]); setMulti('perfisSel',[]); document.getElementById('show_index').checked=true; document.getElementById('show_resultados').checked=true; };

document.getElementById('btnNewP').onclick = ()=> document.getElementById('btnClearP').click();
</script>
</body>
</html>

const headers = {
  'Access-Control-Allow-Origin': '*',
  'Access-Control-Allow-Headers': 'Content-Type',
  'Access-Control-Allow-Methods': 'POST, OPTIONS',
  'Content-Type': 'application/json'
};
exports.handler = async function (event) {
  if (event.httpMethod === 'OPTIONS') return { statusCode: 204, headers, body: '' };
  if (event.httpMethod !== 'POST') return { statusCode: 405, headers, body: JSON.stringify({ error: 'Método não permitido.' }) };
  try {
    const { GH_OWNER, GH_REPO, GH_BRANCH='main', GITHUB_TOKEN, SUPABASE_URL, SUPABASE_SERVICE_KEY, INDEX_PATH='index.html', RESULTS_PATH='pages/resultados.html' } = process.env;
    if (!GH_OWNER || !GH_REPO || !GITHUB_TOKEN) throw new Error('Env faltando: GH_OWNER, GH_REPO ou GITHUB_TOKEN');
    if (!SUPABASE_URL || !SUPABASE_SERVICE_KEY) throw new Error('Env faltando: SUPABASE_URL ou SUPABASE_SERVICE_KEY');
    let accessToken=null; try{ const body=event.body?JSON.parse(event.body):{}; accessToken = body?.accessToken || null; }catch{}
    if(!accessToken) return { statusCode:401, headers, body: JSON.stringify({ error:'Unauthorized' }) };
    const u = await fetch(`${SUPABASE_URL}/auth/v1/user`,{ headers:{ Authorization:`Bearer ${accessToken}`, apikey: SUPABASE_SERVICE_KEY } });
    if(!u.ok) return { statusCode:401, headers, body: JSON.stringify({ error:'Unauthorized' }) };
    const pr = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*`,{ headers:{ apikey: SUPABASE_SERVICE_KEY, Authorization:`Bearer ${SUPABASE_SERVICE_KEY}` } });
    if(!pr.ok) throw new Error(`Falha ao ler products: ${pr.status} ${await pr.text()}`);
    const products = await pr.json();
    const mapFront = (p)=>({ id:p.id, tipo:p.tipo, perfis:p.perfis, logo:p.logo, tag:p.tag, tagClass:p.tagClass||undefined, titulo:p.titulo, vantagens:p.vantagens, link:p.link, btnPrimario:p.btnPrimario, btnSecundario:p.btnSecundario });
    const arrayFor = (page)=>{ const flag=page==='index'?'show_in_index':'show_in_resultados'; const ord=page==='index'?'ordem_index':'ordem_resultados'; return (products||[]).filter(p=>p.ativo!==false && p[flag]!==false).sort((a,b)=>(a[ord]??9999)-(b[ord]??9999)||a.id-b.id).map(mapFront) };
    const jsIndex   = 'const allProducts = '+JSON.stringify(arrayFor('index'),null,2)+';';
    const jsResults = 'const allProducts = '+JSON.stringify(arrayFor('results'),null,2)+';';
    const ghHeaders = { Authorization: `Bearer ${GITHUB_TOKEN}`, Accept: 'application/vnd.github+json' };
    const getFile = async (path)=>{ const url=`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${encodeURIComponent(path)}?ref=${encodeURIComponent(GH_BRANCH)}`; const r=await fetch(url,{headers:ghHeaders}); if(!r.ok) throw new Error(`GitHub GET ${path}: ${r.status} ${await r.text()}`); const j=await r.json(); const content=Buffer.from((j.content||'').replace(/\n/g,''),'base64').toString('utf8'); return { sha:j.sha, content } };
