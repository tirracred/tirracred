<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Admin - TirraCred</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background:#f0fdf4 }
    .sortable-ghost{opacity:.4;background:#c7d2fe}
    .sortable-chosen{cursor:grabbing}
    .modal-bg{background:rgba(0,0,0,.5)}
  </style>
</head>
<body class="text-gray-800">
  <!-- Login -->
  <div id="login" class="min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
      <img src="public/logo.png" class="w-40 mx-auto mb-4" alt="TirraCred"
           onerror="this.onerror=null;this.src='https://placehold.co/160x50/fff/000?text=TirraCred';">
      <h2 class="text-2xl font-bold text-center mb-6">Acesso Restrito</h2>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="text-sm">Email</label>
          <input id="email" type="email" required class="w-full mt-1 px-4 py-2 border rounded-lg">
        </div>
        <div>
          <label class="text-sm">Senha</label>
          <input id="password" type="password" required class="w-full mt-1 px-4 py-2 border rounded-lg">
        </div>
        <button class="w-full py-3 rounded-lg bg-green-600 text-white font-semibold hover:bg-green-700">Entrar</button>
        <p id="loginError" class="text-center text-sm text-red-600 mt-2"></p>
      </form>
    </div>
  </div>

  <!-- Painel -->
  <div id="app" class="hidden">
    <header class="bg-white shadow-md sticky top-0 z-40">
      <div class="container mx-auto px-4 h-16 flex items-center justify-between">
        <img src="public/logo.png" alt="logo" class="h-8"
             onerror="this.onerror=null;this.src='https://placehold.co/150x40/ccc/000?text=TirraCred';">
       <div class="flex items-center gap-2">
        <a href="index.html"
            class="px-3 py-2 rounded-lg border border-gray-200 text-gray-700 hover:bg-gray-100">
            Início
        </a>
        <button id="logout" class="px-3 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">
            Sair
        </button>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6">
      <div class="flex items-start justify-between gap-4 mb-4">
        <h1 class="text-2xl font-bold">Gerenciar Produtos</h1>
        <div class="flex gap-2">
          <button id="add" class="px-4 py-2 bg-green-600 text-white rounded-lg">Novo</button>
          <button id="saveOrder" class="px-4 py-2 bg-green-600 text-white rounded-lg">Salvar Ordem</button>
        </div>
      </div>

      <div id="list" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- cards via JS -->
      </div>
      <p id="status" class="text-sm text-gray-500 mt-4"></p>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal" class="hidden fixed inset-0 modal-bg z-50">
    <div class="bg-white rounded-2xl shadow-2xl max-w-3xl w-[95%] mx-auto my-8 p-6">
      <h3 class="text-xl font-semibold mb-4" id="modalTitle">Editar Produto</h3>
      <form id="form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="hidden" id="id">
        <div><label class="text-sm">Título</label><input id="titulo" class="w-full mt-1 px-3 py-2 border rounded-lg"></div>
        <div><label class="text-sm">Tag</label><input id="tag" class="w-full mt-1 px-3 py-2 border rounded-lg"></div>
        <div><label class="text-sm">Tag Class (red|blue|yellow|purple)</label><input id="tagClass" class="w-full mt-1 px-3 py-2 border rounded-lg"></div>
        <div><label class="text-sm">Logo (public/...)</label><input id="logo" class="w-full mt-1 px-3 py-2 border rounded-lg"></div>
        <div class="md:col-span-2"><label class="text-sm">Link</label><input id="link" class="w-full mt-1 px-3 py-2 border rounded-lg"></div>
        <div><label class="text-sm">Botão Primário</label><input id="btnPrimario" class="w-full mt-1 px-3 py-2 border rounded-lg"></div>
        <div><label class="text-sm">Botão Secundário</label><input id="btnSecundario" class="w-full mt-1 px-3 py-2 border rounded-lg"></div>
        <div class="md:col-span-2">
          <label class="text-sm">Vantagens (uma por linha)</label>
          <textarea id="vantagens" rows="4" class="w-full mt-1 px-3 py-2 border rounded-lg"></textarea>
        </div>
        <div><label class="text-sm">Tipo (ex: emprestimo,cartao,contas,fgts,...)</label>
             <input id="tipo" class="w-full mt-1 px-3 py-2 border rounded-lg"></div>
        <!-- Perfis rápidos (sincroniza com o input acima) -->
      <div class="md:col-span-2" id="perfis-chips">
        <label class="text-sm mb-2 block">Perfis rápidos</label>
        <div class="flex flex-wrap gap-3 text-sm">
          <label class="inline-flex items-center gap-2">
            <input type="checkbox" data-chip="perfil" value="negativado" class="h-4 w-4"> Negativado
          </label>
          <label class="inline-flex items-center gap-2">
            <input type="checkbox" data-chip="perfil" value="score-baixo" class="h-4 w-4"> Score baixo
          </label>
          <label class="inline-flex items-center gap-2">
            <input type="checkbox" data-chip="perfil" value="aposentado" class="h-4 w-4"> Aposentado
          </label>
          <label class="inline-flex items-center gap-2">
            <input type="checkbox" data-chip="perfil" value="bolsafamilia" class="h-4 w-4"> Bolsa Família
          </label>
          <label class="inline-flex items-center gap-2">
            <input type="checkbox" data-chip="perfil" value="autonomo" class="h-4 w-4"> Autônomo
          </label>
        </div>
        <p class="text-xs text-gray-500 mt-2">Marque/desmarque e eu preencho o campo acima (CSV) pra você.</p>
      </div>
             <div class="md:col-span-2">
  <label class="inline-flex items-center gap-2 text-sm">
    <input id="ativo" type="checkbox" class="h-4 w-4">
    Ativo (exibir no site)
  </label>
</div>
        <div><label class="text-sm">Prioridade</label><input id="priority_order" type="number" class="w-full mt-1 px-3 py-2 border rounded-lg"></div>
      </form>
      <div class="flex justify-end gap-2 mt-4">
        <button id="close" class="px-4 py-2 bg-gray-200 rounded-lg">Cancelar</button>
        <button id="save" class="px-4 py-2 bg-green-600 text-white rounded-lg">Salvar</button>
      </div>
    </div>
  </div>

<script>
const SUPABASE_URL = 'https://hgravyvorwbccyufgksn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhncmF2eXZvcndiY2N5dWZna3NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NzUzMTksImV4cCI6MjA2NzA1MTMxOX0.7s_nF8aRgq6gauYhIEHBrqpvO5QzNtgrZHbBaukM0LI';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);
const login = $('login'), app = $('app'), listEl = $('list');
const statusEl = $('status'), modal = $('modal'), form = $('form');

let items = [];

const normCsv = (txt = '') =>
  txt.split(',').map(s => s.trim()).filter(Boolean).join(',');         // "a, b ,c" -> "a,b,c"

// Helpers para sincronizar chips <-> input CSV
const csvToArr = (txt='') => txt.split(',').map(s => s.trim()).filter(Boolean);
const arrToCsv = (arr=[]) => arr.filter(Boolean).join(',');

function renderPerfisChips(perfisCsv) {
  const set = new Set(csvToArr(perfisCsv.toLowerCase()));
  document.querySelectorAll('[data-chip="perfil"]').forEach(cb => {
    cb.checked = set.has(cb.value);
  });
}

function syncPerfisFromChips() {
  const selected = Array.from(document.querySelectorAll('[data-chip="perfil"]:checked')).map(cb => cb.value);
  $('perfis').value = arrToCsv(selected);
}


const normLines = (txt = '') =>
  txt.split('\n').map(s => s.trim()).filter(Boolean).join('\n');       // linhas limpas

const displayCsv = (v) => Array.isArray(v) ? v.join(', ') : (v || ''); // para mostrar nos cards
const editCsv    = (v) => Array.isArray(v) ? v.join(',')    : (v || ''); // para colocar no <input>

const displayLines = (v) => Array.isArray(v) ? v.join('\n') : (v || '');

const cardHTML = (p) => `
  <div class="bg-white border rounded-xl shadow-sm p-4 flex gap-3 items-start ${p.ativo === false ? 'opacity-60' : ''}" data-id="${p.id}">
    <div class="cursor-move select-none px-2 py-1 bg-gray-100 rounded">⇅</div>
    <img src="${p.logo}" class="w-16 h-10 object-contain" onerror="this.onerror=null;this.src='https://placehold.co/64x40/e2e8f0/4a5568?text=Logo';">
    <div class="flex-1">
      <div class="flex items-center justify-between">
        <h4 class="font-semibold">${p.titulo}</h4>
        <div class="flex items-center gap-2">
          <span class="text-[11px] px-2 py-0.5 rounded-full ${p.ativo === false ? 'bg-gray-200 text-gray-600' : 'bg-green-100 text-green-700'}">
            ${p.ativo === false ? 'Inativo' : 'Ativo'}
          </span>
          <span class="text-[11px] px-2 py-0.5 rounded ${p.tagClass ? 'bg-gray-100' : ''}">${p.tag || ''}</span>
        </div>
      </div>
      <p class="text-xs text-gray-500">#${p.priority_order} • ${ displayCsv(p.tipo) }</p>
      <div class="mt-2 flex flex-wrap gap-2">
        <a target="_blank" href="${p.link}" class="text-green-700 underline text-sm">Abrir</a>
        <button class="edit text-sm px-2 py-1 border rounded">Editar</button>
        <button class="duplicate text-sm px-2 py-1 border rounded">Copiar</button>
        <button class="toggle-active text-sm px-2 py-1 border rounded"> ${p.ativo === false ? 'Ativar' : 'Desativar'} </button>
        <button class="delete text-sm px-2 py-1 border rounded text-red-600 hover:bg-red-50">Excluir</button>
      </div>
    </div>
  </div>`;

const openModal = (p={}) => {
  $('modalTitle').textContent = p.id ? 'Editar Produto' : 'Novo Produto';
  ['id','titulo','tag','tagClass','logo','link','btnPrimario','btnSecundario','priority_order']
    .forEach(k => $(k).value = p[k] ?? '');
    $('tipo').value      = editCsv(p.tipo);
    $('perfis').value    = editCsv(p.perfis);
    renderPerfisChips($('perfis').value);
    $('vantagens').value = displayLines(p.vantagens);
    $('ativo').checked = (p.ativo !== false); // default true quando não vier do BD

  modal.classList.remove('hidden');
};
const closeModal = () => modal.classList.add('hidden');

$('close').onclick = closeModal;
// Quando marcar/desmarcar um chip, atualiza o input CSV
document.querySelectorAll('[data-chip="perfil"]').forEach(cb => {
  cb.addEventListener('change', syncPerfisFromChips);
});

// Se digitar manualmente no input, atualiza os chips
$('perfis').addEventListener('input', (e) => {
  renderPerfisChips(e.target.value);
});
$('save').onclick = async () => {
  const btn = $('save');
  const original = btn.innerHTML;

  // estado "salvando"
  btn.disabled = true;
  btn.innerHTML = `
    <span class="inline-flex items-center gap-2">
      <svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" class="opacity-25"></circle>
        <path d="M22 12a10 10 0 0 1-10 10" stroke="currentColor" stroke-width="3" class="opacity-75"></path>
      </svg>
      Salvando...
    </span>`;

  const payload = {
    titulo: $('titulo').value,
    tag: $('tag').value,
    tagClass: $('tagClass').value || null,
    logo: $('logo').value,
    link: $('link').value,
    btnPrimario: $('btnPrimario').value || 'Acessar',
    btnSecundario: $('btnSecundario').value || 'Detalhes',
    vantagens:  normLines($('vantagens').value),
    tipo:       normCsv($('tipo').value),
    perfis:     normCsv($('perfis').value),
    ativo:      $('ativo').checked,
    priority_order: Number($('priority_order').value) || 0
  };

  const id = $('id').value;
  let resp;
  try {
    if (id) resp = await supabase.from('products').update(payload).eq('id', id);
    else     resp = await supabase.from('products').insert(payload).select();

    if (resp.error) throw resp.error;

    // sucesso (check + pulso breve)
    btn.innerHTML = `
      <span class="inline-flex items-center gap-2 animate-pulse">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none">
          <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Salvo!
      </span>`;
    setTimeout(() => {
      btn.innerHTML = original;
      btn.disabled = false;
      closeModal();
      load();
    }, 800);

  } catch (err) {
    alert('Erro: ' + (err?.message || err));
    btn.innerHTML = original;
    btn.disabled = false;
  }
};

$('add').onclick = () => openModal({});

const load = async () => {
  statusEl.textContent = 'Carregando...';
  const { data, error } = await supabase.from('products').select('*').order('priority_order', { ascending: true });
  if (error) { statusEl.textContent = 'Erro ao carregar: ' + error.message; return; }
  items = data || [];
  listEl.innerHTML = items.map(cardHTML).join('');
  statusEl.textContent = `Total: ${items.length} produtos`;

  // editar
  listEl.querySelectorAll('.edit').forEach(btn => {
    btn.onclick = (e) => {
      const id = e.target.closest('[data-id]').dataset.id;
      const p = items.find(x => String(x.id) === String(id));
      openModal(p);
    };
  });
  // ativar/desativar
listEl.querySelectorAll('.toggle-active').forEach(btn => {
  btn.onclick = async (e) => {
    const id = Number(e.target.closest('[data-id]').dataset.id);
    const p  = items.find(x => Number(x.id) === id);
    const novo = !(p.ativo !== false); // true->false, false->true
    const { error } = await supabase.from('products').update({ ativo: novo }).eq('id', id);
    if (error) { alert('Erro: ' + error.message); return; }
    load();
  };
});

// excluir
listEl.querySelectorAll('.delete').forEach(btn => {
  btn.onclick = async (e) => {
    const id = Number(e.target.closest('[data-id]').dataset.id);
    const p  = items.find(x => Number(x.id) === id);
    if (!confirm(`Excluir "${p.titulo}"? Esta ação não pode ser desfeita.`)) return;
    const { error } = await supabase.from('products').delete().eq('id', id);
    if (error) { alert('Erro: ' + error.message); return; }
    load();
  };
});
// duplicar
listEl.querySelectorAll('.duplicate').forEach(btn => {
  btn.onclick = async (e) => {
    const id = Number(e.target.closest('[data-id]').dataset.id);
    const src = items.find(x => Number(x.id) === id);
    if (!src) return;

    // prioridade nova = maior prioridade atual + 1
    const nextPriority = items.reduce((m,p)=>Math.max(m, Number(p.priority_order)||0), -1) + 1;

    // garante string para csv/texto caso o registro carregue como array
    const asCsv   = (v) => Array.isArray(v) ? v.join(',') : (v || '');
    const asText  = (v) => Array.isArray(v) ? v.join('\n') : (v || '');

    const payload = {
      titulo: (src.titulo || 'Sem título') + ' (cópia)',
      tag: src.tag || '',
      tagClass: src.tagClass || null,
      logo: src.logo || '',
      link: src.link || '',
      btnPrimario: src.btnPrimario || 'Acessar',
      btnSecundario: src.btnSecundario || 'Detalhes',
      vantagens: asText(src.vantagens),   // sua coluna é TEXT
      tipo: asCsv(src.tipo),              // CSV em string
      perfis: asCsv(src.perfis),          // CSV em string
      ativo: src.ativo !== false,         // mantém estado (default true)
      priority_order: nextPriority
    };

    statusEl.textContent = 'Copiando...';
    const { error } = await supabase.from('products').insert(payload).select();
    statusEl.textContent = error ? ('Erro ao copiar: ' + error.message) : 'Produto copiado!';
    if (!error) load();
  };
});

  // drag and drop
  new Sortable(listEl, {
    animation: 150,
    handle: '.cursor-move',
    ghostClass: 'sortable-ghost',
  });
};

$('saveOrder').onclick = async () => {
  const ids = Array.from(listEl.children).map(el => Number(el.dataset.id));
  const updates = ids.map((id, idx) => ({ id, priority_order: idx }));
  statusEl.textContent = 'Salvando ordem...';

  // upsert em lote
  const { error } = await supabase.from('products').upsert(updates, { onConflict: 'id' });
  statusEl.textContent = error ? ('Erro ao salvar: '+error.message) : 'Ordem salva!';
  if (!error) load();
};

$('logout').onclick = async () => {
  await supabase.auth.signOut();
  app.classList.add('hidden');
  login.classList.remove('hidden');
};

$('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  $('loginError').textContent = '';
  const email = $('email').value.trim();
  const password = $('password').value;

  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) { $('loginError').textContent = error.message; return; }

  login.classList.add('hidden');
  app.classList.remove('hidden');
  load();
};

// sessão persistida
(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) { login.classList.add('hidden'); app.classList.remove('hidden'); load(); }
})();
</script>
</body>
</html>
