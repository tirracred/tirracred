         /**
          * Extrai e converte os parâmetros da URL.
          * @returns {object} Um objeto com os parâmetros tipados.
          */
         function getUrlParams() {
             const params = new URLSearchParams(window.location.search);
             return {
                 nome: params.get('nome') || 'Cliente',
                 valor: Number(params.get('valor')) || 0,
                 parcelas: Number(params.get('parcelas')) || 0,
                 negativado: params.get('negativado') === 'true',
                 aposentado: params.get('aposentado') === 'true',
                 bolsafamilia: params.get('bolsafamilia') === 'true',
             };
         }

         /**
          * Encontra produtos em um array com base em um critério.
          * @param {object} criteria - Ex: { tipo: 'fgts' } ou { id: 7 }
          * @param {Array} sourceArray - O array de produtos para buscar.
          * @returns {Array} Um array de produtos que correspondem ao critério.
          */
         function findProducts(criteria, sourceArray) {
             const key = Object.keys(criteria)[0];
             const value = criteria[key];
             return sourceArray.filter(product => {
                 if (Array.isArray(product[key])) {
                     return product[key].includes(value);
                 }
                 return product[key] === value;
             });
         }

         // ========================================================================
         // III. MOTOR DE PRIORIZAÇÃO DE PRODUTOS
         // ========================================================================

         /**
          * Ordena os produtos com base nas regras de negócio e nos parâmetros do usuário.
          * @param {Array} products - O array completo de produtos.
          * @param {object} params - Os parâmetros do usuário vindos da URL.
          * @returns {Array} Um novo array de produtos ordenado por prioridade.
          */
         function prioritizeProducts(products, params) {
             let priorityOrder = [];

             const buildOrderedList = (priorityIds) => {
                 const priorityProducts = priorityIds.map(id => products.find(p => p.id === id)).filter(Boolean);
                 const priorityIdSet = new Set(priorityIds);
                 const otherProducts = products.filter(p => !priorityIdSet.has(p.id));
                 return [...priorityProducts, ...otherProducts];
             };

             // Regra 1: Aposentado/Pensionista (máxima prioridade)
             if (params.aposentado) {
                 priorityOrder = [7, 20, 16, 2, 1, 4, 12];
                 return buildOrderedList(priorityOrder);
             }
              
             // Regra 2: Bolsa Família (segunda prioridade)
             if (params.bolsafamilia) {
                 const fgtsProductIds = findProducts({ tipo: 'fgts' }, products).map(p => p.id);
                 priorityOrder = [14, 19, ...fgtsProductIds, 1, 2, 4, 6, 12];
                 return buildOrderedList(priorityOrder);
             }

             // Regra 3: Negativado - LÓGICA DE TESTE A/B IMPLEMENTADA
             if (params.negativado) {
                 const fgtsProductIds = findProducts({ tipo: 'fgts' }, products).map(p => p.id);
                 
                 // Variação A (Principal): Mostra o produto de renegociação (ID 17)
                 const variationA = [18, 1, 2, 3, 4, 5, 6, 7, 12, 13, ...fgtsProductIds];
                 
                 // Variação B (Teste): NÃO mostra o produto 18.
                 const variationB = [2, 1, 13, 2, 3, 4, 5, 6, 7, 12, ...fgtsProductIds];

                 // --- LÓGICA DO TESTE A/B ---
                 // Vamos mostrar a Variação A (com ID 17) na maioria das vezes (ex: 70% de chance)
                 // e a Variação B nos outros 30% dos casos.
                 // Você pode ajustar este valor como quiser. 0.7 = 70%, 0.5 = 50%, etc.
                 if (Math.random() < 0.7) { 
                     priorityOrder = variationA;
                     console.log("Teste A/B: Mostrando Variação A (com Renegociação)");
                 } else {
                     priorityOrder = variationB;
                     console.log("Teste A/B: Mostrando Variação B (sem Renegociação)");
                 }

                 return buildOrderedList(priorityOrder);
             }

             // Regra 4: Score Regular (cenário padrão, se nenhuma das anteriores for verdade)
             const fgtsProductIds = findProducts({ tipo: 'fgts' }, products).map(p => p.id);
             priorityOrder = [8, 13, 2, 1, 3, ...fgtsProductIds, 16, 4];
             return buildOrderedList(priorityOrder);
         }

             setTimeout(() => {
                 if (loadingState) loadingState.style.display = 'none';
                 if (resultsContent) resultsContent.style.display = 'block';
                  
                 if (productGrid && productsToRender.length > 0) {
                     productsToRender.forEach(product => {
                         const vantagensHtml = product.vantagens.map(v => `<li class="flex items-start"><span class="text-green-500 mr-2 mt-1">✔</span><span>${v}</span></li>`).join('');
                         
                         let chanceBadge = `<div class="absolute -top-3 -right-3 chance-badge bg-green-600 text-white text-sm font-bold px-3 py-1 rounded-full shadow-lg">${product.displayChance}% DE CHANCE</div>`;

                         const cardHtml = `
                            <div class="product-card bg-white rounded-xl border border-gray-200 shadow-sm p-6 flex flex-col fade-in relative h-full">
                                ${chanceBadge}
                                <div class="flex items-center justify-between">
                                    <div class="w-28 h-12 flex items-center justify-start">
                                        <img src="${product.logo}" alt="Logo ${product.titulo}" class="max-w-full max-h-full object-contain" onerror="this.onerror=null;this.src='https://placehold.co/112x48/e2e8f0/4a5568?text=Logo';">
                                    </div>
                                    <span class="inline-block bg-gray-200 text-gray-800 text-xs font-semibold px-2 py-1 rounded-full">${product.tag}</span>
                                </div>
                                <h3 class="text-xl font-bold text-gray-800 mt-4 mb-3">${product.titulo}</h3>
                                <ul class="space-y-2 text-gray-600 text-sm flex-grow">
                                    ${vantagensHtml}
                                </ul>
                                <a href="${product.link}" target="_blank" class="btn-primary mt-6 w-full">
                                    ${product.btnPrimario}
                                </a>
                            </div>
                         `;
                         productGrid.innerHTML += cardHtml;
                     });
                 } else if (productGrid) {
                     productGrid.innerHTML = '<p class="text-center text-gray-600 col-span-full">Nenhuma oferta encontrada para o seu perfil.</p>';
                 }
             }, transitionTime);
         });
      
     </script>

 </body>
 </html>
