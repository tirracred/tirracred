<!DOCTYPE html>
 <html lang="pt-BR" class="scroll-smooth">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Suas Recomendações de Crédito - TirraCred</title>
     <link rel="icon" type="image/png" href="../public/favincon.png"/>
     <script src="https://cdn.tailwindcss.com"></script>
     
     <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
     <style>
         body {
             font-family: 'Inter', sans-serif;
             background-color: #f0fdf4;
         }
         @keyframes fadeIn {
             from { opacity: 0; transform: translateY(20px); }
             to { opacity: 1; transform: translateY(0); }
         }
         @keyframes pulse {
             0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.7); }
             50% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(22, 163, 74, 0); }
         }
         .fade-in {
             animation: fadeIn 0.8s ease-in-out forwards;
         }
         .product-card {
             transition: all 0.3s ease;
         }
         .product-card:hover {
             transform: translateY(-5px);
             box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
         }
         .btn-primary {
             background: linear-gradient(135deg, #10b981, #059669);
             color: white;
             padding: 12px 24px;
             border-radius: 8px;
             font-weight: 600;
             text-decoration: none;
             display: inline-block;
             transition: all 0.3s ease;
             box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
             text-align: center;
         }
         .btn-primary:hover {
             background: linear-gradient(135deg, #059669, #047857);
             transform: translateY(-2px);
             box-shadow: 0 8px 12px -2px rgba(0, 0, 0, 0.15);
         }
         .chance-badge {
             animation: pulse 2s infinite;
         }
     </style>
     <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4935884639623224"
crossorigin="anonymous"></script>


 </head>
 <body class="bg-green-50 text-gray-800">

     <div class="bg-yellow-400 text-center p-2 text-sm font-semibold text-yellow-900">
         Atenção! A TirraCred não cobra nenhum depósito antecipado para a liberação de produtos financeiros.
     </div>

     <header class="bg-white shadow-md sticky top-0 z-50">
         <div class="container mx-auto px-4 sm:px-6 lg:px-8">
             <div class="flex items-center justify-between h-16">
                 <div class="flex-shrink-0">
                     <a href="../index.html" class="flex items-center">
                         <img src="../public/logo.png" alt="TirraCred Logo" class="h-8 w-auto" onerror="this.onerror=null;this.src='https://placehold.co/150x40/cccccc/000000?text=TirraCred';">
                     </a>
                 </div>
                 <nav class="hidden md:flex md:space-x-8">
                     <a href="../index.html" class="text-gray-600 hover:text-green-600 font-medium transition-colors">Início</a>
                 </nav>
             </div>
         </div>
     </header>

     <main class="py-12 sm:py-16">
         <div class="container mx-auto px-4 sm:px-6 lg:px-8">
              
             <div id="loading-state" class="text-center py-20">
                 <svg class="animate-spin h-10 w-10 text-green-600 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                     <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                     <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                 </svg>
                 <h1 class="text-2xl font-bold mt-6 text-gray-700">A analisar as melhores ofertas...</h1>
                 <p class="text-gray-500 mt-2">Olá, <span id="lead-name" class="font-semibold">cliente</span>! Estamos a analisar o seu perfil para encontrar as soluções ideais para você.</p>
             </div>

             <div id="results-content" class="hidden">
                 <div class="text-center mb-10">
                     <h1 class="text-3xl md:text-4xl font-extrabold text-gray-800 mt-4">Aqui estão as suas chances!</h1>
                 </div>

                 <div id="results-message" class="bg-green-100 border-l-4 border-green-500 text-green-800 p-4 rounded-r-lg my-8 max-w-4xl mx-auto fade-in"></div>


                 <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>



                 <div class="text-center mt-12">
                     <a href="../index.html" class="btn-primary">
                         Ver Outros Produtos
                     </a>
                 </div>
             </div>

         </div>
     </main>

     <footer class="bg-green-900 text-white mt-16">
         <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-12">
            </div>
     </footer>

     <script>
    document.addEventListener('DOMContentLoaded', async () => {
        // ========================================================================
        // I. CONFIGURAÇÃO E ELEMENTOS DO DOM
        // ========================================================================
        const productGrid = document.getElementById('product-grid');
        const loadingState = document.getElementById('loading-state');
        const resultsContent = document.getElementById('results-content');
        const messageBox = document.getElementById('results-message');
        const leadNameSpan = document.getElementById('lead-name');
        const transitionTime = 2000;

        // --- Configuração do Supabase ---
        const SUPABASE_URL = 'https://hgravyvorwbccyufgksn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhncmF2eXZvcndiY2N5dWZna3NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NzUzMTksImV4cCI6MjA2NzA1MTMxOX0.7s_nF8aRgq6gauYhIEHBrqpvO5QzNtgrZHbBaukM0LI';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ========================================================================
        // II. FUNÇÕES UTILITÁRIAS E DE PRIORIZAÇÃO (O seu código original)
        // ========================================================================
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                nome: params.get('nome') || 'Cliente',
                valor: Number(params.get('valor')) || 0,

                negativado: params.get('negativado') === 'true',
                aposentado: params.get('aposentado') === 'true',
                bolsafamilia: params.get('bolsafamilia') === 'true',
            };
        }

            function findProducts(criteria, sourceArray) {
            const key = Object.keys(criteria)[0];
            const value = String(criteria[key]).toLowerCase();
            return sourceArray.filter(p => toArray(p[key], true).includes(value));
            }


            function prioritizeProducts(products, params) {
            const fgtsProductIds = findProducts({ tipo: 'fgts' }, products).map(p => p.id); // calcula no topo
            let priorityOrder = [];

            const buildOrderedList = (priorityIds) => {
                const priorityProducts = priorityIds
                .map(id => products.find(p => p.id === id))
                .filter(Boolean);
                const priorityIdSet = new Set(priorityIds);
                const otherProducts = products.filter(p => !priorityIdSet.has(p.id));
                return [...priorityProducts, ...otherProducts];
            };

            if (params.aposentado) {
                priorityOrder = [8, 20, 16, 2, 1, 5, 12];
                return buildOrderedList(priorityOrder);
            }

            if (params.bolsafamilia) {
                priorityOrder = [15, 20, ...fgtsProductIds, 1, 2, 5, 7, 12];
                return buildOrderedList(priorityOrder);
            }

            if (params.negativado) {
                const variationA = [18, 1, 2, 4, 5, 7, 10, 14, 12, 13, 3, ...fgtsProductIds];
                const variationB = [ 2, 1, 4, 5, 7, 10, 14, 12, 13, 3, ...fgtsProductIds];
                priorityOrder = (Math.random() < 0.7) ? variationA : variationB;
                return buildOrderedList(priorityOrder);
            }

            priorityOrder = [9, 1, 2, 5, 4, 10, 3, ...fgtsProductIds];
            return buildOrderedList(priorityOrder);
            }

        // ========================================================================
        // III. BLOCO DE EXECUÇÃO PRINCIPAL
        // ========================================================================

        // 1. Ingerir parâmetros da URL
        const params = getUrlParams();
        if (leadNameSpan) {
            leadNameSpan.textContent = params.nome.split(' ')[0] || 'Cliente';
        }

        // 2. BUSCAR PRODUTOS DO BANCO DE DADOS
        const { data: allProducts, error } = await supabase
            .from('products')
            .select('*')
            .order('priority_order', { ascending: true });
        
        if (error) {
            console.error("Erro ao buscar produtos:", error);
            if (loadingState) loadingState.innerHTML = '<p class="text-red-500">Ocorreu um erro ao carregar as ofertas. Tente novamente.</p>';
            return;
        }

        // 3. Priorizar os produtos com base nos parâmetros
        const orderedProducts = prioritizeProducts(allProducts, params);

        // 4. Enriquecer dados e renderizar
        const productsToRender = orderedProducts.map(product => {
        let displayChance = Math.floor(Math.random() * (98 - 75 + 1)) + 75;
        if (toArray(product.tipo, true).includes('fgts')) displayChance = 99;
            return { ...product, displayChance };
        });

        let message = '';
        const formatCurrency = (value) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
        if (params.negativado) {
            message = `<p class="font-bold text-lg mb-2">Análise para ${formatCurrency(params.valor)} em perfil negativado!</p>
                       <p>Mesmo com restrições, existem ótimas chances para você. As nossas principais recomendações estão no topo da lista!</p>`;
        } else {
            message = `<p class="font-bold text-lg mb-2">Análise para ${formatCurrency(params.valor)} concluída!</p>
                       <p>Com o seu perfil, você já tem acesso a ótimas condições! Vamos te mostrar ofertas com as maiores chances de aprovação para o valor que precisa no topo.</p>`;
        }
        if (messageBox) messageBox.innerHTML = message;

        setTimeout(() => {
            if (loadingState) loadingState.style.display = 'none';
            if (resultsContent) resultsContent.style.display = 'block';
            if (productGrid && productsToRender.length > 0) {
                productsToRender.forEach(product => {
                   const vantagensHtml = toArray(product.vantagens).map(v => `
                    <li class="flex items-start"><span class="text-green-500 mr-2 mt-1">✔</span><span>${v}</span></li>
                    `).join('');
                    const chanceBadge = `<div class="absolute -top-3 -right-3 chance-badge bg-green-600 text-white text-sm font-bold px-3 py-1 rounded-full shadow-lg">${product.displayChance}% DE CHANCE</div>`;
                    const cardHtml = `
                        <div class="product-card bg-white rounded-xl border border-gray-200 shadow-sm p-6 flex flex-col fade-in relative h-full">
                            ${chanceBadge}
                            <div class="flex items-center justify-between">
                                <div class="w-28 h-12 flex items-center justify-start">
                                    <img src="../${product.logo}" alt="Logo ${product.titulo}" class="max-w-full max-h-full object-contain" onerror="this.onerror=null;this.src='https://placehold.co/112x48/e2e8f0/4a5568?text=Logo';">
                                </div>
                                <span class="inline-block bg-gray-200 text-gray-800 text-xs font-semibold px-2 py-1 rounded-full">${product.tag}</span>
                            </div>
                            <h3 class="text-xl font-bold text-gray-800 mt-4 mb-3">${product.titulo}</h3>
                            <ul class="space-y-2 text-gray-600 text-sm flex-grow">${vantagensHtml}</ul>
                            <a href="${product.link}" target="_blank" class="btn-primary mt-6 w-full">${product.btnPrimario}</a>
                        </div>
                    `;
                    productGrid.innerHTML += cardHtml;
                });
            } else if (productGrid) {
                productGrid.innerHTML = '<p class="text-center text-gray-600 col-span-full">Nenhuma oferta encontrada para o seu perfil.</p>';
            }
        }, transitionTime);
    });

    // Converte text[], JSON string ou string simples em array
        function toArray(v, lower = false) {
        if (Array.isArray(v)) return lower ? v.map(x => String(x).toLowerCase().trim()) : v;
        if (typeof v === 'string') {
            // tenta JSON
            try {
            const j = JSON.parse(v);
            if (Array.isArray(j)) return lower ? j.map(s => String(s).toLowerCase().trim()) : j;
            } catch (e) {}
            // tenta formato Postgres text[] -> "{a,b}""
            const arr = v.replace(/^\{|\}$/g,'').split(',')
            .map(s => s.replace(/"/g,'').trim())
            .filter(Boolean);
            return lower ? arr.map(s => s.toLowerCase()) : arr;
        }
        return [];
        }

</script>

 </body>

 </html>
