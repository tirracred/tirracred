<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Chat Admin - TirraCred</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="public/favincon.png"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background:#f3f4f6; height: 100vh; overflow: hidden; }
    /* Scrollbar fina */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 10px; }
  </style>
</head>
<body class="flex flex-col">

  <header class="bg-white shadow-sm z-10 border-b shrink-0">
    <div class="container mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="public/logo.png" alt="logo" class="h-8" onerror="this.onerror=null;this.src='https://placehold.co/150x40/ccc/000?text=TirraCred';">
        <span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full font-bold">Painel de Chat</span>
      </div>
      <div>
        <a href="admin.html" class="px-4 py-2 text-sm font-medium text-gray-700 hover:text-green-600 transition">
          ← Voltar para Produtos
        </a>
      </div>
    </div>
  </header>

  <main class="flex-1 container mx-auto px-4 py-4 flex gap-4 overflow-hidden h-[calc(100vh-64px)]">
    
    <aside class="w-1/3 max-w-sm bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col overflow-hidden">
      <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
        <h2 class="font-bold text-gray-700">Atendimentos</h2>
        <button onclick="loadSessions()" class="text-xs text-blue-600 hover:underline">Atualizar ↻</button>
      </div>
      <div id="sessions-list" class="flex-1 overflow-y-auto divide-y divide-gray-100">
        <p class="p-8 text-center text-gray-400 text-sm">Carregando...</p>
      </div>
    </aside>

    <section class="flex-1 bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col overflow-hidden relative">
      
      <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 bg-gray-50/50 z-0">
        <svg class="w-16 h-16 mb-4 opacity-20" fill="currentColor" viewBox="0 0 20 20"><path d="M2 5a2 2 0 012-2h7a2 2 0 012 2v4a2 2 0 01-2 2H9l-3 3v-3H4a2 2 0 01-2-2V5z"/><path d="M15 7v2a4 4 0 01-4 4H9.828l-1.766 1.767c.28.149.599.233.938.233h2l3 3v-3h2a2 2 0 002-2V9a2 2 0 00-2-2h-1z"/></svg>
        <p>Selecione um cliente ao lado para iniciar</p>
      </div>

      <div id="chat-header" class="hidden shrink-0 p-4 border-b flex justify-between items-center bg-white z-10">
        <div>
          <h3 id="visitor-name" class="font-bold text-lg text-gray-800">Nome do Cliente</h3>
          <div id="visitor-status-badge" class="inline-flex items-center text-xs px-2 py-0.5 rounded bg-gray-100 text-gray-500 mt-1">
            Carregando status...
          </div>
        </div>
        <button id="btn-takeover" onclick="toggleHumanMode()" class="hidden text-sm font-bold px-4 py-2 rounded-lg transition border shadow-sm">
          Ação
        </button>
      </div>

      <div id="chat-messages" class="hidden flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50/30 z-10">
        </div>

      <form id="chat-form" class="hidden shrink-0 p-4 bg-white border-t z-10">
        <div class="flex gap-2">
          <input id="msg-input" type="text" autocomplete="off" placeholder="Digite sua resposta..." 
                 class="flex-1 px-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50 focus:bg-white transition">
          <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-xl font-bold hover:bg-blue-700 transition flex items-center gap-2">
            <span>Enviar</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
          </button>
        </div>
      </form>

    </section>
  </main>

<script>
// --- CONFIGURAÇÃO SUPABASE ---
const SUPABASE_URL = 'https://hgravyvorwbccyufgksn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhncmF2eXZvcndiY2N5dWZna3NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NzUzMTksImV4cCI6MjA2NzA1MTMxOX0.7s_nF8aRgq6gauYhIEHBrqpvO5QzNtgrZHbBaukM0LI';

// CORREÇÃO AQUI: Usamos '_supabase' para evitar conflito com a variável global da biblioteca
const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Elementos
const sessionsList = document.getElementById('sessions-list');
const emptyState = document.getElementById('empty-state');
const chatHeader = document.getElementById('chat-header');
const chatMessages = document.getElementById('chat-messages');
const chatForm = document.getElementById('chat-form');
const visitorNameEl = document.getElementById('visitor-name');
const statusBadge = document.getElementById('visitor-status-badge');
const btnTakeover = document.getElementById('btn-takeover');

let activeSessionId = null;
let activeSessionStatus = 'ai';
let activeSubscription = null;

// --- 1. AUTH CHECK ---
(async () => {
  // CORREÇÃO: chamando _supabase
  const { data: { session } } = await _supabase.auth.getSession();
  if (!session) {
    window.location.href = 'admin.html';
  } else {
    loadSessions();
    subscribeToNewSessions();
  }
})();

// --- 2. LISTAR SESSÕES ---
async function loadSessions() {
  // CORREÇÃO: chamando _supabase
  const { data, error } = await _supabase
    .from('chat_sessions')
    .select('*')
    .order('created_at', { ascending: false }); 

  if (error) {
    console.error('Erro ao listar:', error);
    sessionsList.innerHTML = '<p class="p-4 text-red-500 text-center">Erro de conexão</p>';
    return;
  }

  sessionsList.innerHTML = '';
  if (data.length === 0) {
    sessionsList.innerHTML = '<p class="p-4 text-gray-400 text-center">Nenhum atendimento iniciado.</p>';
    return;
  }

  data.forEach(session => {
    const el = document.createElement('div');
    const isActive = session.id === activeSessionId;
    
    const statusDot = session.status === 'ai' 
      ? '<span class="w-2 h-2 rounded-full bg-purple-500 mr-2"></span>' 
      : '<span class="w-2 h-2 rounded-full bg-yellow-500 mr-2"></span>';

    el.className = `p-4 cursor-pointer transition border-l-4 ${isActive ? 'bg-blue-50 border-blue-500' : 'hover:bg-gray-50 border-transparent'}`;
    el.onclick = () => openChat(session);
    
    el.innerHTML = `
      <div class="flex justify-between items-start">
        <h4 class="font-bold text-gray-800 text-sm">${session.visitor_name || 'Visitante'}</h4>
        <span class="text-[10px] text-gray-400">${new Date(session.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
      </div>
      <div class="flex items-center mt-1 text-xs text-gray-500">
        ${statusDot}
        ${session.status === 'ai' ? 'Robô falando' : 'Você assumiu'}
      </div>
      <div class="text-[10px] text-gray-400 mt-1 truncate">WhatsApp: ${session.visitor_phone || '-'}</div>
    `;
    sessionsList.appendChild(el);
  });
}

// --- 3. ABRIR CHAT ---
async function openChat(session) {
  activeSessionId = session.id;
  activeSessionStatus = session.status;

  loadSessions(); 
  emptyState.classList.add('hidden');
  chatHeader.classList.remove('hidden');
  chatMessages.classList.remove('hidden');
  chatForm.classList.remove('hidden');
  
  visitorNameEl.textContent = session.visitor_name;
  updateHeaderUI();

  chatMessages.innerHTML = '<div class="text-center py-10"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-gray-900 mx-auto"></div></div>';
  
  // CORREÇÃO: chamando _supabase
  const { data, error } = await _supabase
    .from('chat_messages')
    .select('*')
    .eq('session_id', session.id)
    .order('created_at', { ascending: true });

  if (!error) {
    chatMessages.innerHTML = '';
    data.forEach(renderMessage);
    scrollToBottom();
    startRealtime(session.id);
  }
}

// --- 4. RENDERIZAR MENSAGENS ---
function renderMessage(msg) {
  const div = document.createElement('div');
  
  let alignClass = 'justify-start';
  let bubbleClass = 'bg-white border text-gray-800 rounded-tl-none';
  let label = `<span class="text-[10px] text-gray-400 mb-1 block">Cliente</span>`;

  if (msg.sender === 'ai') {
    alignClass = 'justify-start';
    bubbleClass = 'bg-purple-50 border border-purple-100 text-gray-800 rounded-tl-none';
    label = `<span class="text-[10px] text-purple-600 font-bold mb-1 block">🤖 Robô</span>`;
  } else if (msg.sender === 'admin') {
    alignClass = 'justify-end';
    bubbleClass = 'bg-blue-600 text-white rounded-tr-none shadow-md';
    label = ''; 
  }

  div.className = `flex ${alignClass} animate-fade-in`;
  div.innerHTML = `
    <div class="max-w-[80%]">
      ${label}
      <div class="p-3 rounded-xl shadow-sm text-sm ${bubbleClass}">
        ${msg.content}
      </div>
    </div>
  `;
  chatMessages.appendChild(div);
}

// --- 5. ENVIAR MENSAGEM (ADMIN) ---
chatForm.onsubmit = async (e) => {
  e.preventDefault();
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !activeSessionId) return;

  input.value = '';

  // CORREÇÃO: chamando _supabase
  await _supabase.from('chat_messages').insert({
    session_id: activeSessionId,
    sender: 'admin',
    content: text
  });

  if (activeSessionStatus === 'ai') {
    toggleHumanMode(true); 
  }
};

// --- 6. CONTROLE HUMANO vs ROBÔ ---
async function toggleHumanMode(forceHuman = false) {
  if (!activeSessionId) return;

  const newStatus = (activeSessionStatus === 'ai' || forceHuman) ? 'human' : 'ai';
  
  // CORREÇÃO: chamando _supabase
  await _supabase.from('chat_sessions')
    .update({ status: newStatus })
    .eq('id', activeSessionId);

  activeSessionStatus = newStatus;
  updateHeaderUI();
  loadSessions(); 
}

function updateHeaderUI() {
  btnTakeover.classList.remove('hidden');
  
  if (activeSessionStatus === 'ai') {
    statusBadge.className = "inline-flex items-center text-xs px-2 py-0.5 rounded bg-purple-100 text-purple-700 font-bold border border-purple-200";
    statusBadge.innerHTML = "🤖 Robô Ativo";
    
    btnTakeover.textContent = "🛑 Assumir Controle";
    btnTakeover.className = "text-xs font-bold px-3 py-2 rounded bg-red-50 text-red-600 border border-red-200 hover:bg-red-600 hover:text-white transition shadow-sm";
  } else {
    statusBadge.className = "inline-flex items-center text-xs px-2 py-0.5 rounded bg-yellow-100 text-yellow-800 font-bold border border-yellow-200";
    statusBadge.innerHTML = "👤 Humano no comando";
    
    btnTakeover.textContent = "🔄 Devolver p/ Robô";
    btnTakeover.className = "text-xs font-bold px-3 py-2 rounded bg-green-50 text-green-600 border border-green-200 hover:bg-green-600 hover:text-white transition shadow-sm";
  }
}

// --- 7. REALTIME ---
function startRealtime(sessionId) {
  // CORREÇÃO: chamando _supabase
  if (activeSubscription) _supabase.removeChannel(activeSubscription);

  activeSubscription = _supabase
    .channel('chat_room_' + sessionId)
    .on('postgres_changes', { 
      event: 'INSERT', 
      schema: 'public', 
      table: 'chat_messages', 
      filter: `session_id=eq.${sessionId}` 
    }, payload => {
      renderMessage(payload.new);
      scrollToBottom();
    })
    .subscribe();
}

// CORREÇÃO: chamando _supabase para a lista lateral
_supabase
  .channel('public:chat_sessions')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_sessions' }, () => {
    loadSessions(); 
  })
  .subscribe();

function scrollToBottom() {
  chatMessages.scrollTop = chatMessages.scrollHeight;
}
</script>
</body>
</html>
